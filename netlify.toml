# Deploy no Netlify (por enquanto só o front-end, em modo demonstração):
# a API é simulada no navegador, sem back-end nem banco. Contas demo no README/docs.
[build]
  base = "frontend"
  command = "npm run build:demo"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: rotas profundas (/entrar, /app/...) caem no index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
